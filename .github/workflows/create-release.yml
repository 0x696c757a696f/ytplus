name: Create Lumtub release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create a release tag from the application version and commit
        id: prepare
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          latest_tag=$(git tag --merged HEAD --list 'v*' --sort=-creatordate | head -n 1 || true)
          if [[ -n "$latest_tag" ]]; then
            changes=$(git rev-list --count "$latest_tag..HEAD")
            if [[ "$changes" == 0 ]]; then
              echo "No commits since $latest_tag; no release is created."
              echo 'release=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$SCHEDULED" == true ]]; then
              last_release=$(git for-each-ref --format='%(creatordate:unix)' "refs/tags/$latest_tag")
              now=$(date +%s)
              if (( now - last_release < 30 * 24 * 60 * 60 )); then
                echo "Last release $latest_tag is less than 30 days old; no release is created."
                echo 'release=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          pubspec_version=$(sed -n 's/^version: *\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          [[ "$pubspec_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "pubspec.yaml must declare a stable semantic version, found: $pubspec_version" >&2
            exit 1
          }
          commit=$(git rev-parse --short=7 HEAD)
          tag="v$pubspec_version-$commit"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 && {
            echo "Tag $tag already exists" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Lumtub $tag"
          git push origin "$tag"
          echo 'release=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Created $tag from application version $pubspec_version and commit $commit"

      - name: Dispatch the tagged Windows release build
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref "${{ steps.prepare.outputs.tag }}"
          echo 'The tagged Windows build was dispatched.'
          echo 'That workflow builds the ZIP and installer, then creates the GitHub Release with generated release notes.'
