[package]
name = "lumtub_core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native helpers Lumtub calls through dart:ffi"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
